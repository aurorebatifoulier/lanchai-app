# CI — every push to master and every pull request: install, typecheck, lint, build the
# Cloud Functions, then ALL tests (unit + Firestore / Storage rules + Cloud Functions on
# the Firebase emulators, demo project "demo-lanchai": no secrets, nothing touches the
# real project). Any failing step makes the check red.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator needs Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Install (app)
        run: npm ci
      - name: Install (functions)
        run: npm ci --prefix functions

      - name: Typecheck (app)
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Unit tests
        run: npm run test:unit
      - name: Rules + Cloud Functions tests (emulators)
        run: npm run test:emu
